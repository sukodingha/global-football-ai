name: global_football_ai
description: Global Football AI - Production-ready football prediction application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Routing
  go_router: ^14.0.0

  # State Management
  flutter_riverpod: ^2.5.1

# Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  firebase_performance: ^0.10.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.0.0

# Biometric & Secure Storage
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.0

  # Local Preferences
  shared_preferences: ^2.2.3

  # Utility
  crypto: ^3.0.3
  equatable: ^2.0.5
  http: ^1.2.0

  # UI
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
